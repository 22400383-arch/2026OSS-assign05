<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container {
            width: 200px;
            height: 50px;
            background-color: rgb(250, 250, 213);
        }
    </style>
</head>

<body>
    <div id="list">
        <p id="item1">apple</p>
        <p id="item2">banana</p>
        <p id="item3">orange</p>
    </div>
    <button id="deleteBtn">삭제</button>


    <!--동적요소추가-->
    <button id="addbtn">동적요소 추가</button>
    <div id="container" style="border:1px solid"></div>

    <!--Click이벤트-->
    <button id="clickbtn1">눌러보세요(alert)</button>
    <button id="clickbtn2">눌러보세요(innerText)</button>
    <button id="clickbtn3">눌러보세요(innerHTML)</button>
    <div>여기에 데이터가 바뀝니다!</div>

    <!--계산기-->
    <form method="post">
        <input type="number" id="n1" size="5">
        <button readonly>+</button>
        <input type="number" id="n2" size="5">
        <button onclick="add()">=</button>
        <input type="text" id="result" size="5" readonly>
    </form>


    <!--innerHTML / innerText / textContent-->
    <div id="div1" onclick="changeText()">Hello</div>



</body>

</html>
<!--or btn.addEventListener("click", function(){ })-->

<script>
    const addbtn = document.querySelector("#addbtn");
    const container= document.querySelector("#container");
    const p = document.createElement("p");
    addbtn.addEventListener("click", function(){
        p.textContent = "새 문단입니다.";
        container.appendChild(p);
    })



    const clickbtn1 = document.querySelector("#clickbtn1");
    clickbtn1.addEventListener("click", function () {
        alert = ("Hello!");
    });


    function add() {
        const n1 = document.querySelector("#n1").value;
        const n2 = document.querySelector("#n2").value;
        const result = Number(n1) + Number(n2);
        document.querySelector("#result").value = result;
    }


    function changeText() {
        document.getElementById("div1").innerHTML = "<h1>Hello World</h1>";
    }

</script>
